name: Functional tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  functional-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out the test suite
        uses: actions/checkout@v4
        with:
          repository: ValElizaTan/valerie-site-tests
          path: tests

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: tests
        run: npx playwright install --with-deps chromium

      - name: Serve public/ on port 8000
        run: python3 -m http.server 8000 --directory public > server.log 2>&1 &

      - name: Wait for the server
        run: |
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/ > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not respond on port 8000"; cat server.log; exit 1

      - name: Run functional tests
        working-directory: tests
        env:
          BASE_URL: http://localhost:8000
        run: npm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7
